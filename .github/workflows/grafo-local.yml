name: Pruebas del grafo local

on:
  pull_request:
    paths:
      - 'pipelines/communitylab/**'
      - '.github/workflows/grafo-local.yml'
  push:
    branches: [main]
    paths:
      - 'pipelines/communitylab/**'
      - '.github/workflows/grafo-local.yml'

permissions:
  contents: read

jobs:
  pruebas:
    name: Grafo local (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipelines/communitylab/requirements-lock.txt
      - run: python -m pip install -r pipelines/communitylab/requirements-lock.txt
      - run: python -m pip check
      - run: python -m unittest discover -s pipelines/communitylab/tests -v
