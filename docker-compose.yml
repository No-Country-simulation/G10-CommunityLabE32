services:

  postgres:
    image: postgres:16
    container_name: g10-communitylab-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: communitylab
      POSTGRES_USER: communitylab
      POSTGRES_PASSWORD: communitylab_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: