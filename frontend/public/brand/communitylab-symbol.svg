<svg xmlns="http://www.w3.org/2000/svg" width="414" height="470" viewBox="305 160 414 470" role="img" aria-labelledby="title desc">
  <title id="title">Community Lab</title>
  <desc id="desc">Símbolo de tres personas entrelazadas de CommunityLab, sin texto inferior.</desc>

  <defs>
    <!-- Subtle depth shadow gradient for the reconstructed green inner fold -->
    <linearGradient id="green-fold-depth" x1="585" y1="450" x2="628" y2="506" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#426b4c"/>
      <stop offset="45%" stop-color="#56875f"/>
      <stop offset="100%" stop-color="#6b9e75"/>
    </linearGradient>
    <!-- Matching subtle depth shadow gradient for the pink inner fold -->
    <linearGradient id="pink-fold-depth" x1="358" y1="457" x2="395" y2="515" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#91457d"/>
      <stop offset="45%" stop-color="#aa5294"/>
      <stop offset="100%" stop-color="#bb62a5"/>
    </linearGradient>
    <!-- Matching subtle depth shadow gradient for the yellow left fold -->
    <linearGradient id="yellow-fold-depth" x1="459" y1="300" x2="459" y2="375" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b8c1d"/>
      <stop offset="45%" stop-color="#a2a425"/>
      <stop offset="100%" stop-color="#b6b82c"/>
    </linearGradient>
  </defs>

  <!-- Background -->


  <!-- Isometric Emblem -->
  <g id="emblem">
    <!-- Top Figure (Yellow - Uniform 63px leg width & 75px bar height) -->
    <g id="figure-top">
      <circle id="head-top" cx="512" cy="208" r="36.5" fill="#f1f333"/>
      <polygon id="body-top-dark" points="428,280 491,321 491,383 428,342" fill="url(#yellow-fold-depth)"/>
      <polygon id="body-top-light" points="428,280 491,246 598,311 598,378 535,415 535,348 491,321" fill="#f1f333"/>
    </g>

    <!-- Left Figure (Pink - Refined flush edges & matching fold depth) -->
    <g id="figure-left">
      <circle id="head-left" cx="368.5" cy="319" r="36.5" fill="#ff90e8"/>
      <polygon id="body-left-dark" points="317,484 400,435 400,530" fill="url(#pink-fold-depth)"/>
      <polygon id="body-left-upper" points="317,402 428,342 491,383 400,435 317,484" fill="#ff90e8"/>
      <polygon id="body-left-lower" points="400,435 460,470 460,586 400,551" fill="#ff90e8"/>
    </g>

    <!-- Right & Bottom Figure (Green / Teal - All segments thickened to match 60px+ width / 78px height) -->
    <g id="figure-right">
      <circle id="head-right" cx="655.5" cy="319" r="36.5" fill="#b9e9c5"/>
      <!-- Reconstructed inner background fold thickened from 43px to 60px wide (x=568..628) -->
      <polygon id="body-right-inner-fold" points="568,472 628,438.8 628,506" fill="url(#green-fold-depth)"/>
      <!-- Upper light green shoulder -->
      <polygon id="body-right-upper" points="535,415 638,355 707,395 638,433.2 568,472" fill="#b9e9c5"/>
      <!-- Outer right dark green leg -->
      <polygon id="body-right-dark" points="638,433.2 707,395 707,490 638,530" fill="#6b9e75"/>
      <!-- Lower light green arm (60px vertical riser x=568..628 and 78px bottom height) -->
      <polygon id="body-bottom-light" points="520,542 568,515 568,472 628,506 628,558 520,620" fill="#b9e9c5"/>
      <!-- Lower dark green background fold (60px width x=460..520 and 78px height) -->
      <polygon id="body-bottom-dark" points="460,508 520,542 520,620 460,586" fill="#588461"/>
    </g>
  </g>

</svg>
