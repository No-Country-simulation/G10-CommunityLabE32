server {
    listen 80;
    server_name communitylab.alyntai.com;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "proxy ok\n";
    }

    location / {
        return 301 https://communitylab.alyntai.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name communitylab.alyntai.com;
    server_tokens off;
    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    ssl_certificate /etc/letsencrypt/live/communitylab.alyntai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/communitylab.alyntai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web_upstream web:3000;
    set $api_upstream api:8000;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "proxy ok\n";
    }

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://$web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
