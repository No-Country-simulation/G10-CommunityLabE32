services:

  postgres:
    image: postgres:16
    container_name: g10-communitylab-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: communitylab
      POSTGRES_USER: communitylab
      POSTGRES_PASSWORD: communitylab_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: g10-communitylab-api
    restart: unless-stopped

    ports:
      - "8000:8000"

    depends_on:
      - postgres

    environment:
      DATABASE_URL: postgresql://communitylab:communitylab_dev@postgres:5432/communitylab

volumes:
  postgres_data: