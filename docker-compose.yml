# Integración local propuesta: worker ejecutable; revisar contrato con Fredy.
x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-database: &database
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: ${POSTGRES_DB:-communitylab}
  PGUSER: ${POSTGRES_USER:-communitylab}
  PGPASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en un archivo .env privado}

services:
  proxy:
    <<: *runtime
    image: ${PROXY_IMAGE:-nginx:stable-alpine}
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [frontend, outbound]
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    <<: *runtime
    image: ${WEB_IMAGE:-communitylab-web:local}
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://api:8000
      # Procedencia: desplegar.sh exporta GIT_REVISION con el commit construido.
      labels:
        org.opencontainers.image.revision: ${GIT_REVISION:-desconocido}
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: http://api:8000
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    networks: [frontend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    <<: *runtime
    image: ${API_IMAGE:-communitylab-api:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      labels:
        org.opencontainers.image.revision: ${GIT_REVISION:-desconocido}
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-communitylab}:${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-communitylab}
      # Vacíos = acciones protegidas deshabilitadas (503). Ver docs/flujo-hibrido-banners.md.
      OPERADOR_TOKEN: ${OPERADOR_TOKEN:-}
      PUENTE_TOKEN: ${PUENTE_TOKEN:-}
      PUENTE_ORIGEN: ${PUENTE_ORIGEN:-discord}
      # Cuentas y sesiones (docs/politica-acceso.md). Sin JWT_SECRET_KEY (>= 32 bytes aleatorios) el
      # login responde 503: no hay clave por defecto. Las demás tienen valores seguros por defecto.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      SESION_HORAS: ${SESION_HORAS:-8}
      SESION_COOKIE_SEGURA: ${SESION_COOKIE_SEGURA:-true}
      REGISTRO_PUBLICO: ${REGISTRO_PUBLICO:-false}
      LOGIN_MAX_INTENTOS: ${LOGIN_MAX_INTENTOS:-5}
      LOGIN_MAX_INTENTOS_IP: ${LOGIN_MAX_INTENTOS_IP:-30}
      LOGIN_VENTANA_SEGUNDOS: ${LOGIN_VENTANA_SEGUNDOS:-900}
      # Único origen del que se acepta X-Real-IP (nginx la sobrescribe con la IP del cliente).
      LOGIN_PROXY_CONFIABLE: ${LOGIN_PROXY_CONFIABLE:-proxy}
      # Importación histórica de Discord (docs/discord-historico.md). Vacías = rutas en 503 (seguro).
      DISCORD_HISTORICO_TOKEN: ${DISCORD_HISTORICO_TOKEN:-}
      DISCORD_HISTORICO_AUTORIZADOS: ${DISCORD_HISTORICO_AUTORIZADOS:-}
      DISCORD_HISTORICO_MAX_MENSAJES: ${DISCORD_HISTORICO_MAX_MENSAJES:-5000}
      DISCORD_HISTORICO_MAX_DIAS: ${DISCORD_HISTORICO_MAX_DIAS:-400}
      DISCORD_HISTORICO_CONFIRMAR_DIAS: ${DISCORD_HISTORICO_CONFIRMAR_DIAS:-31}
      DISCORD_HISTORICO_CONFIRMAR_MENSAJES: ${DISCORD_HISTORICO_CONFIRMAR_MENSAJES:-1000}
      # «Generar post» de Curaduría (una llamada por clic, tope por borrador). Sin clave: 503, sin efectos.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELOS: ${GEMINI_MODELOS:-}
      GEMINI_TIMEOUT_PETICION: ${GEMINI_TIMEOUT_PETICION:-30}
      GEMINI_PRESUPUESTO_SEGUNDOS: ${GEMINI_PRESUPUESTO_SEGUNDOS:-100}
      GEMINI_MAX_TOKENS_SALIDA: ${GEMINI_MAX_TOKENS_SALIDA:-2048}
      GEMINI_REINTENTOS: ${GEMINI_REINTENTOS:-1}
      GEMINI_ESPERA_MAXIMA: ${GEMINI_ESPERA_MAXIMA:-10}
      CURADURIA_MAX_GENERACIONES: ${CURADURIA_MAX_GENERACIONES:-3}
      # Copia de los activos aprobados en OCI Object Storage con la identidad de la VM (sin llaves).
      OCI_ALMACENAMIENTO: ${OCI_ALMACENAMIENTO:-desactivado}
      OCI_BUCKET_NAME: ${OCI_BUCKET_NAME:-communitylab-activos-marketing}
      OCI_NAMESPACE: ${OCI_NAMESPACE:-}
    networks: [frontend, database, outbound]
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *runtime
    image: ${WORKER_IMAGE:-communitylab-worker:local}
    build:
      context: .
      dockerfile: worker/Dockerfile
      labels:
        org.opencontainers.image.revision: ${GIT_REVISION:-desconocido}
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    environment:
      <<: *database
      DATABASE_URL: postgresql://${POSTGRES_USER:-communitylab}:${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-communitylab}
      WORKER_MODE: ${WORKER_MODE:?Definir simulado o gemini explícitamente}
      WORKER_TIMEOUT: ${WORKER_TIMEOUT:-300}
      # Copia del paquete de cada procesamiento en OCI (misma configuración que la API).
      OCI_ALMACENAMIENTO: ${OCI_ALMACENAMIENTO:-desactivado}
      OCI_BUCKET_NAME: ${OCI_BUCKET_NAME:-communitylab-activos-marketing}
      OCI_NAMESPACE: ${OCI_NAMESPACE:-}
      # Solo en modo gemini. La clave y los modelos se definen en .env privado, nunca en Git.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELOS: ${GEMINI_MODELOS:-}
      GEMINI_TIMEOUT_PETICION: ${GEMINI_TIMEOUT_PETICION:-30}
      # Cuenta gratuita de Gemini: esperar los 429 por ritmo (ver docs/gemini-grafo-worker.md).
      GEMINI_PRESUPUESTO_SEGUNDOS: ${GEMINI_PRESUPUESTO_SEGUNDOS:-240}
      GEMINI_MAX_LLAMADAS: ${GEMINI_MAX_LLAMADAS:-24}
      GEMINI_MAX_TOKENS_SALIDA: ${GEMINI_MAX_TOKENS_SALIDA:-2048}
      GEMINI_MAX_TOKENS_TRABAJO: ${GEMINI_MAX_TOKENS_TRABAJO:-40000}
      GEMINI_REINTENTOS: ${GEMINI_REINTENTOS:-2}
      GEMINI_ESPERA_MAXIMA: ${GEMINI_ESPERA_MAXIMA:-60}
      GEMINI_TAMANO_BLOQUE: ${GEMINI_TAMANO_BLOQUE:-40}
      GEMINI_NIVEL_RAZONAMIENTO: ${GEMINI_NIVEL_RAZONAMIENTO:-}
      GEMINI_TEMPERATURA: ${GEMINI_TEMPERATURA:-}
    networks: [database, outbound]
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "/app/worker/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db-init:
    image: ${WORKER_IMAGE:-communitylab-worker:local}
    build:
      context: .
      dockerfile: worker/Dockerfile
      labels:
        org.opencontainers.image.revision: ${GIT_REVISION:-desconocido}
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-communitylab}:${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-communitylab}
    command: ["python", "-m", "worker.init_db"]
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    <<: *runtime
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-communitylab}
      POSTGRES_USER: ${POSTGRES_USER:-communitylab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en un archivo .env privado}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  frontend:
    driver: bridge
    internal: true
  database:
    driver: bridge
    internal: true
  outbound:
    driver: bridge

volumes:
  postgres_data:
