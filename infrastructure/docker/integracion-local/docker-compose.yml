# Entorno aislado para validar el mock. Ver README.md de esta carpeta.
x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-database: &database
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: ${POSTGRES_DB:-communitylab}
  PGUSER: ${POSTGRES_USER:-communitylab}
  PGPASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en un archivo .env privado}

services:
  proxy:
    <<: *runtime
    image: ${PROXY_IMAGE:-nginx:stable-alpine}
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [frontend]
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    <<: *runtime
    image: ${WEB_IMAGE:?Definir la imagen ARM64 real de web}
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    networks: [frontend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    <<: *runtime
    image: ${API_IMAGE:?Definir la imagen ARM64 real de api}
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    environment:
      <<: *database
    networks: [frontend, database]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *runtime
    image: ${WORKER_IMAGE:?Definir la imagen ARM64 real de worker}
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    environment:
      <<: *database
    networks: [database, outbound]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    <<: *runtime
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-communitylab}
      POSTGRES_USER: ${POSTGRES_USER:-communitylab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en un archivo .env privado}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  frontend:
    driver: bridge
  database:
    driver: bridge
    internal: true
  outbound:
    driver: bridge

volumes:
  postgres_data:
